name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up environment
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        require-lockfile: true
        cache: true

    - name: Run ESLint
      run: pnpm lint

  build:
    name: Build & Types
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up environment
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        require-lockfile: true
        cache: true

    #- name: Generate worker types
    #  run: pnpm run generate-types --check

    - name: Build
      run: pnpm run build
